name: Main Telescope
dew_point_sensors:
- sal_name: ESS
  sal_index: 111  # see ESS configuration
  sal_topic: tel_dewPoint
  sal_field: dewPointItem
  sensor_names:
  - Camera-ESS01
temperature_sensors:
- sal_name: MTCamera
  sal_index: 0
  sal_topic: tel_utiltrunk_UT
  sal_field: coolPipeSplyTemp
warning_level: 4.0
critical_level: 3.5
hysteresis: 0.2
poll_interval: 0.1
max_data_age: 3.0
